<!DOCTYPE html><html lang="ru"> <head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><meta name="robots" content="noindex"><title>Администрирование</title><style>
      *,
      *::before,
      *::after {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      :root {
        --bg: #050505;
        --text: #fafafa;
        --accent: #e4d5b7;
        --muted: #a1a1aa;
        --border: #27272a;
        --surface: #0a0a0a;
        --danger: #ef4444;
        --radius: 10px;
      }

      body {
        font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
        background: var(--bg);
        color: var(--text);
        line-height: 1.6;
        min-height: 100dvh;
      }

      .container {
        max-width: 1600px;
        margin: 0 auto;
        padding: 40px 32px 80px;
      }

      h1 {
        font-size: 2.25rem;
        font-weight: 700;
        margin-bottom: 32px;
        color: var(--accent);
      }

      .auth-section,
      .form-section,
      .book-list-section {
        display: none;
      }

      .auth-section.active,
      .form-section.active,
      .book-list-section.active {
        display: block;
      }

      .auth-section.active {
        max-width: 600px;
        margin: 0 auto;
      }

      .form-section.active {
        max-width: 800px;
        margin: 0 auto;
      }

      .user-bar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        padding: 16px 24px;
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: var(--radius);
        margin-bottom: 32px;
        font-size: 1rem;
      }

      .user-bar span {
        color: var(--muted);
      }

      .user-bar strong {
        color: var(--text);
        font-weight: 500;
      }

      .btn-logout {
        background: none;
        border: 1px solid var(--border);
        color: var(--muted);
        padding: 8px 16px;
        border-radius: 6px;
        cursor: pointer;
        font-size: 0.875rem;
        font-family: inherit;
        transition: border-color 0.15s, color 0.15s;
        white-space: nowrap;
      }

      .btn-logout:hover {
        border-color: var(--muted);
        color: var(--text);
      }

      label {
        display: block;
        font-size: 0.875rem;
        font-weight: 500;
        margin-bottom: 6px;
        color: var(--text);
      }

      label .optional {
        color: var(--muted);
        font-weight: 400;
        font-size: 0.8125rem;
      }

      input[type='text'],
      input[type='number'],
      input[type='password'],
      textarea {
        width: 100%;
        padding: 10px 14px;
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 8px;
        color: var(--text);
        font-family: inherit;
        font-size: 0.9375rem;
        outline: none;
        transition: border-color 0.15s;
      }

      input[type='text']:focus,
      input[type='number']:focus,
      input[type='password']:focus,
      textarea:focus {
        border-color: var(--accent);
      }

      textarea {
        min-height: 180px;
        resize: vertical;
      }

      .field {
        margin-bottom: 20px;
      }

      .checkbox-row {
        display: flex;
        align-items: center;
        gap: 8px;
        margin-top: 10px;
        margin-bottom: 20px;
      }

      .checkbox-row input[type='checkbox'] {
        width: 16px;
        height: 16px;
        accent-color: var(--accent);
        cursor: pointer;
      }

      .checkbox-row label {
        margin-bottom: 0;
        font-size: 0.8125rem;
        color: var(--muted);
        cursor: pointer;
      }

      .drop-zone {
        border: 2px dashed var(--border);
        border-radius: var(--radius);
        padding: 28px 16px;
        text-align: center;
        cursor: pointer;
        transition: border-color 0.15s, background 0.15s;
        color: var(--muted);
        font-size: 0.875rem;
        position: relative;
      }

      .drop-zone:hover,
      .drop-zone.dragover {
        border-color: var(--accent);
        background: rgba(228, 213, 183, 0.04);
      }

      .drop-zone input[type='file'] {
        position: absolute;
        inset: 0;
        opacity: 0;
        cursor: pointer;
      }

      .previews {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        margin-top: 10px;
      }

      .preview-item {
        position: relative;
        width: 100px;
        height: 100px;
        border-radius: 8px;
        overflow: hidden;
        border: 1px solid var(--border);
      }

      .preview-item img {
        width: 100%;
        height: 100%;
        object-fit: cover;
      }

      .preview-item .remove-btn,
      .cover-preview .remove-btn {
        position: absolute;
        top: 4px;
        right: 4px;
        width: 22px;
        height: 22px;
        background: rgba(0, 0, 0, 0.7);
        border: none;
        border-radius: 50%;
        color: var(--text);
        font-size: 14px;
        line-height: 1;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      .preview-item .remove-btn:hover,
      .cover-preview .remove-btn:hover {
        background: var(--danger);
      }

      .cover-preview {
        margin-top: 10px;
        max-width: 180px;
        border-radius: 8px;
        border: 1px solid var(--border);
        overflow: hidden;
        display: none;
        position: relative;
      }

      .cover-preview img {
        width: 100%;
        display: block;
      }

      .epub-name {
        margin-top: 8px;
        font-size: 0.8125rem;
        color: var(--accent);
        word-break: break-all;
      }

      .btn-primary {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 100%;
        padding: 14px 24px;
        background: var(--accent);
        color: var(--bg);
        border: none;
        border-radius: 8px;
        font-size: 1rem;
        font-weight: 600;
        font-family: inherit;
        cursor: pointer;
        transition: opacity 0.15s;
        margin-top: 8px;
      }

      .btn-primary:hover:not(:disabled) {
        opacity: 0.9;
      }

      .btn-primary:disabled {
        opacity: 0.35;
        cursor: not-allowed;
      }

      .error-text {
        color: var(--danger);
        font-size: 0.8125rem;
        margin-top: 8px;
      }

      .overlay {
        position: fixed;
        inset: 0;
        background: rgba(0, 0, 0, 0.85);
        display: none;
        align-items: center;
        justify-content: center;
        z-index: 100;
        padding: 20px;
      }

      .overlay.active {
        display: flex;
      }

      .overlay-content {
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 14px;
        padding: 32px;
        max-width: 440px;
        width: 100%;
        text-align: center;
      }

      .overlay-content h2 {
        font-size: 1.125rem;
        margin-bottom: 20px;
        color: var(--text);
      }

      .progress-bar-track {
        width: 100%;
        height: 8px;
        background: var(--border);
        border-radius: 4px;
        overflow: hidden;
        margin-bottom: 14px;
      }

      .progress-bar-fill {
        height: 100%;
        background: var(--accent);
        border-radius: 4px;
        width: 0%;
        transition: width 0.3s;
      }

      .progress-status {
        font-size: 0.875rem;
        color: var(--muted);
        min-height: 1.4em;
      }

      .result-link {
        display: inline-block;
        margin-top: 16px;
        color: var(--accent);
        text-decoration: underline;
        text-underline-offset: 3px;
      }

      .result-link:hover {
        opacity: 0.8;
      }

      .overlay-actions {
        margin-top: 20px;
        display: none;
      }

      .overlay-actions button {
        padding: 10px 24px;
        border-radius: 8px;
        border: 1px solid var(--border);
        background: var(--surface);
        color: var(--text);
        font-size: 0.875rem;
        font-family: inherit;
        cursor: pointer;
        transition: border-color 0.15s;
      }

      .overlay-actions button:hover {
        border-color: var(--muted);
      }

      .editor-tabs {
        display: flex;
        margin-bottom: -1px;
        position: relative;
        z-index: 1;
      }

      .editor-tab {
        padding: 8px 16px;
        background: transparent;
        border: 1px solid var(--border);
        border-bottom: none;
        color: var(--muted);
        font-size: 0.8125rem;
        font-family: inherit;
        cursor: pointer;
        transition: color 0.15s, background 0.15s;
      }

      .editor-tab:first-child {
        border-radius: 8px 0 0 0;
      }

      .editor-tab:last-child {
        border-radius: 0 8px 0 0;
      }

      .editor-tab.active {
        color: var(--text);
        background: var(--surface);
        border-bottom-color: var(--surface);
      }

      .md-preview {
        display: none;
        min-height: 180px;
        padding: 14px;
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 0 0 8px 8px;
        color: color-mix(in srgb, var(--text) 82%, var(--muted));
        font-family: "Iowan Old Style", "Palatino Linotype", "Book Antiqua", Georgia, serif;
        line-height: 1.8;
        font-size: 0.9375rem;
      }

      .md-preview h2,
      .md-preview h3 {
        margin: 1.5rem 0 0.75rem;
        color: var(--text);
        font-weight: 700;
      }

      .md-preview p {
        margin-bottom: 1rem;
      }

      .md-preview ul {
        padding-left: 1.25rem;
        margin-bottom: 1rem;
      }

      .md-preview li {
        margin-bottom: 0.5rem;
      }

      .md-preview strong {
        color: var(--text);
      }

      /* ── Book list ── */

      .list-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 20px;
      }

      .sort-select {
        background: var(--surface);
        border: 1px solid var(--border);
        color: var(--text);
        padding: 8px 12px;
        border-radius: 8px;
        font-family: inherit;
        font-size: 0.875rem;
        outline: none;
        cursor: pointer;
        transition: border-color 0.15s;
      }

      .sort-select:hover, .sort-select:focus {
        border-color: var(--accent);
      }

      .btn-add {
        background: var(--accent);
        color: var(--bg);
        border: none;
        padding: 10px 20px;
        border-radius: 8px;
        font-size: 0.875rem;
        font-weight: 600;
        font-family: inherit;
        cursor: pointer;
        transition: opacity 0.15s;
      }

      .btn-add:hover {
        opacity: 0.9;
      }

      .books-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(450px, 1fr));
        gap: 24px;
      }

      .book-card {
        display: flex;
        flex-direction: column;
        gap: 20px;
        padding: 24px;
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: var(--radius);
        align-items: flex-start;
      }

      .book-card-top {
        display: flex;
        gap: 24px;
        width: 100%;
      }

      .book-card-cover {
        width: 120px;
        height: 180px;
        flex-shrink: 0;
        border-radius: 8px;
        overflow: hidden;
        background: var(--border);
        box-shadow: 0 8px 24px rgba(0,0,0,0.6);
      }

      .book-card-cover img {
        width: 100%;
        height: 100%;
        object-fit: cover;
      }

      .book-card-info {
        flex: 1;
        min-width: 0;
        display: flex;
        flex-direction: column;
        justify-content: center;
      }

      .book-card-title {
        font-size: 1.25rem;
        font-weight: 600;
        color: var(--text);
        overflow: hidden;
        text-overflow: ellipsis;
        display: -webkit-box;
        -webkit-line-clamp: 2;
        -webkit-box-orient: vertical;
        line-height: 1.35;
      }

      .book-card-author {
        font-size: 1rem;
        color: var(--muted);
        margin-top: 8px;
      }

      .book-card-stats {
        font-size: 0.9375rem;
        color: var(--muted);
        margin-top: 16px;
        display: flex;
        gap: 20px;
        background: rgba(255,255,255,0.03);
        padding: 10px 16px;
        border-radius: 8px;
        border: 1px solid rgba(255,255,255,0.05);
      }

      .book-card-actions {
        display: flex;
        gap: 16px;
        flex-shrink: 0;
        width: 100%;
        margin-top: auto;
      }

      .btn-card {
        padding: 12px 20px;
        border-radius: 8px;
        border: 1px solid var(--border);
        background: rgba(255,255,255,0.02);
        color: var(--muted);
        font-size: 0.9375rem;
        font-weight: 500;
        font-family: inherit;
        cursor: pointer;
        transition: all 0.2s;
        white-space: nowrap;
        flex: 1;
      }

      .btn-card:hover {
        border-color: var(--text);
        color: var(--bg);
        background: var(--text);
      }

      .btn-card.danger {
        flex: 0;
      }

      .btn-card.danger:hover {
        border-color: var(--danger);
        color: white;
        background: var(--danger);
      }

      .loading-text {
        text-align: center;
        color: var(--muted);
        padding: 40px 0;
        font-size: 0.875rem;
      }

      .empty-state {
        text-align: center;
        color: var(--muted);
        padding: 60px 0;
        font-size: 0.9375rem;
        display: none;
      }

      .btn-back {
        background: none;
        border: none;
        color: var(--muted);
        font-size: 0.875rem;
        font-family: inherit;
        cursor: pointer;
        padding: 0;
        margin-bottom: 20px;
        transition: color 0.15s;
      }

      .btn-back:hover {
        color: var(--text);
      }

      /* ── Delete confirmation ── */

      .delete-book-name {
        color: var(--accent);
        font-size: 0.9375rem;
        margin-top: 4px;
        margin-bottom: 4px;
      }

      .delete-actions {
        display: flex;
        gap: 12px;
        justify-content: center;
        margin-top: 20px;
      }

      .btn-confirm-delete {
        padding: 10px 24px;
        background: var(--danger);
        border: none;
        border-radius: 8px;
        color: white;
        font-family: inherit;
        font-size: 0.875rem;
        font-weight: 500;
        cursor: pointer;
        transition: opacity 0.15s;
      }

      .btn-confirm-delete:hover {
        opacity: 0.85;
      }

      .btn-cancel {
        padding: 10px 24px;
        border-radius: 8px;
        border: 1px solid var(--border);
        background: transparent;
        color: var(--text);
        font-size: 0.875rem;
        font-family: inherit;
        cursor: pointer;
        transition: border-color 0.15s;
      }

      .btn-cancel:hover {
        border-color: var(--muted);
      }

      @media (max-width: 768px) {
        .container {
          padding: 24px 20px 60px;
        }
        .books-grid {
          grid-template-columns: 1fr;
        }
        .book-card-top {
          gap: 16px;
        }
        .book-card-cover {
          width: 90px;
          height: 130px;
        }
        .book-card-title {
          font-size: 1.125rem;
        }
        .book-card-author {
          font-size: 0.9375rem;
        }
        .btn-card {
          padding: 10px 14px;
        }
      }

      @media (max-width: 480px) {
        .container {
          padding: 20px 16px 48px;
        }
        h1 {
          font-size: 1.5rem;
        }
        .preview-item {
          width: 72px;
          height: 72px;
        }
        .book-card {
          gap: 16px;
          padding: 16px;
        }
        .book-card-cover {
          width: 80px;
          height: 115px;
        }
        .list-header {
          flex-direction: column;
          align-items: stretch;
          gap: 12px;
        }
        .btn-add {
          width: 100%;
        }
      }

      /* ── Лента скачиваний (закреплённая панель) ── */
      body { padding-right: 360px; }
      .dl-drawer {
        position: fixed;
        top: 0;
        right: 0;
        height: 100vh;
        width: 360px;
        background: var(--surface);
        border-left: 1px solid var(--border);
        box-shadow: -8px 0 32px rgba(0, 0, 0, 0.18);
        z-index: 40;
        display: flex;
        flex-direction: column;
      }
      .dl-head {
        padding: 16px;
        border-bottom: 1px solid var(--border);
        display: flex;
        align-items: flex-start;
        justify-content: space-between;
        gap: 8px;
      }
      .dl-head-title { font-weight: 700; font-size: 1rem; }
      .dl-when { font-size: 0.75rem; color: var(--muted); margin-top: 2px; }
      .dl-actions { display: flex; align-items: center; gap: 4px; }
      .dl-icon-btn {
        background: none;
        border: none;
        color: var(--muted);
        cursor: pointer;
        font-size: 1.25rem;
        line-height: 1;
        padding: 4px 6px;
        border-radius: 6px;
      }
      .dl-icon-btn:hover { color: var(--accent); }
      .dl-body { flex: 1; overflow-y: auto; padding: 8px 16px 24px; }
      .dl-total {
        padding: 12px 0;
        border-bottom: 1px solid var(--border);
        font-size: 0.9375rem;
      }
      .dl-section-title {
        margin: 18px 0 4px;
        font-size: 0.75rem;
        letter-spacing: 0.06em;
        text-transform: uppercase;
        color: var(--muted);
        font-weight: 700;
      }
      .dl-item { padding: 12px 0; border-bottom: 1px solid var(--border); }
      .dl-item-title { font-weight: 600; font-size: 0.9375rem; }
      .dl-meta { font-size: 0.8125rem; color: var(--muted); margin-top: 2px; }
      .dl-delta { color: var(--accent); font-weight: 700; }
      .dl-row {
        display: flex;
        align-items: baseline;
        justify-content: space-between;
        gap: 10px;
        padding: 7px 0;
        border-bottom: 1px solid var(--border);
        font-size: 0.875rem;
      }
      .dl-row-count { font-weight: 700; color: var(--accent); white-space: nowrap; }
      .dl-note {
        margin-top: 14px;
        font-size: 0.75rem;
        line-height: 1.5;
        color: var(--muted);
      }
      .dl-empty {
        padding: 16px 0;
        color: var(--muted);
        font-size: 0.875rem;
        line-height: 1.55;
      }
      @media (max-width: 1100px) {
        body { padding-right: 0; }
        .dl-drawer {
          position: static;
          width: auto;
          height: auto;
          border-left: none;
          border-top: 1px solid var(--border);
          box-shadow: none;
        }
        .dl-body { max-height: 65vh; }
      }

      var REPO = 'Sm1-Tee/chit-ai';

      /* ── GitHub API helper ── */

      function ghFetch(path, opts) {
        opts = opts || {};
        return fetch(API + path, {
          method: opts.method || 'GET',
          headers: {
            Authorization: 'token ' + token,
            'Content-Type': 'application/json',
          },
          body: opts.body,
        }).then(function (res) {
          return res.json().then(function (data) {
            if (!res.ok) throw new Error(data.message || 'GitHub API ' + res.status);
            return data;
          });
        });
      }

      /* ── Utils ── */

      function ext(name) {
        return name.split('.').pop().toLowerCase();
      }

      function decodeBase64Utf8(base64) {
        var raw = atob(base64.replace(/\n/g, ''));
        var bytes = new Uint8Array(raw.length);
        for (var i = 0; i < raw.length; i++) bytes[i] = raw.charCodeAt(i);
        return new TextDecoder().decode(bytes);
      }

      function parseFrontmatter(content) {
        var match = content.match(/^---\r?\n([\s\S]+?)\r?\n---\r?\n?([\s\S]*)$/);
        if (!match) return null;
        var fm = {};
        var lines = match[1].split('\n');
        var currentArray = null;
        for (var i = 0; i < lines.length; i++) {
          var line = lines[i];
          if (currentArray && /^\s+-\s+/.test(line)) {
            var val = line.replace(/^\s+-\s+/, '').trim().replace(/^["']|["']$/g, '');
            fm[currentArray].push(val);
            continue;
          }
          var kv = line.match(/^(\w+):\s*(.*)$/);
          if (kv) {
            var key = kv[1];
            var rawVal = (kv[2] || '').trim();
            if (rawVal === '') {
              currentArray = key;
              fm[key] = [];
            } else {
              currentArray = null;
              rawVal = rawVal.replace(/^["']|["']$/g, '');
              fm[key] = /^\d+$/.test(rawVal) ? parseInt(rawVal, 10) : rawVal;
            }
          }
        }
        return { frontmatter: fm, body: match[2].trim() };
      }

      var TRANSLIT = {
        'а':'a','б':'b','в':'v','г':'g','д':'d','е':'e','ё':'yo',
        'ж':'zh','з':'z','и':'i','й':'y','к':'k','л':'l','м':'m',
        'н':'n','о':'o','п':'p','р':'r','с':'s','т':'t','у':'u',
        'ф':'f','х':'kh','ц':'ts','ч':'ch','ш':'sh','щ':'shch',
        'ъ':'','ы':'y','ь':'','э':'e','ю':'yu','я':'ya',
      };

      
      function getRepoPath(fmPath) {
        if (!fmPath) return '';
        if (fmPath.indexOf('../../assets/books') === 0) {
          return 'src/assets/books' + fmPath.substring('../../assets/books'.length);
        }
        if (fmPath.indexOf('/books') === 0) {
          return 'public/books' + fmPath.substring('/books'.length);
        }
        // fallback
        return fmPath.replace(/^\//, '');
      }

      function getRawUrl(fmPath) {
        if (!fmPath) return '';
        return RAW_BASE + '/' + getRepoPath(fmPath);
      }

      function fetchDownloadStats() {
        return ghFetch('/repos/' + REPO + '/releases')
          .then(function(releases) {
            var total = 0;
            releases.forEach(function(rel) {
              if (rel.assets) {
                rel.assets.forEach(function(asset) {
                  total += asset.download_count;
                  statsCache[asset.name] = asset.download_count;
                });
              }
            });
            var panel = document.getElementById('statsPanel');
            var totalEl = document.getElementById('totalDownloads');
            if (panel && totalEl) {
              totalEl.textContent = total.toLocaleString('ru-RU');
              panel.style.display = 'block';
            }
            if (booksCache && booksCache.length > 0) {
              sortBooksAndRender();
            }
          })
          .catch(function(e) { console.error('Ошибка загрузки статистики:', e); });
      }

      function slugify(text) {
        return text
          .toLowerCase()
          .split('')
          .map(function (c) { return TRANSLIT[c] !== undefined ? TRANSLIT[c] : c; })
          .join('')
          .replace(/[^a-z0-9]+/g, '-')
          .replace(/^-+|-+$/g, '');
      }

      function readFileAsBase64(file) {
        return new Promise(function (resolve, reject) {
          var reader = new FileReader();
          reader.onload = function () { resolve(reader.result.split(',')[1]); };
          reader.onerror = function () { reject(new Error('Ошибка чтения: ' + file.name)); };
          reader.readAsDataURL(file);
        });
      }

      /* ── Navigation ── */

      function showView(name) {
        el.authSection.classList.toggle('active', name === 'auth');
        el.bookListSection.classList.toggle('active', name === 'list');
        el.formSection.classList.toggle('active', name === 'form');

        if (name === 'auth') el.pageTitle.textContent = 'Администрирование';
        if (name === 'list') el.pageTitle.textContent = 'Книги';
      }

      /* ── Auth ── */

      function doLogin() {
        var t = el.tokenInput.value.trim();
        if (!t) return;
        el.authError.textContent = '';
        el.loginBtn.disabled = true;
        el.loginBtn.textContent = 'Проверка…';
        token = t;
        ghFetch('/user')
          .then(function (user) {
            if (el.rememberToken.checked) localStorage.setItem('github_token', t);
            currentLogin = user.login;
            el.username.textContent = user.login;
            showView('list');
            loadBooks();
          })
          .catch(function (err) {
            el.authError.textContent = 'Не удалось авторизоваться: ' + err.message;
          })
          .finally(function () {
            el.loginBtn.disabled = false;
            el.loginBtn.textContent = 'Войти';
          });
      }

      el.loginBtn.addEventListener('click', doLogin);
      el.tokenInput.addEventListener('keydown', function (e) {
        if (e.key === 'Enter') doLogin();
      });

      el.logoutBtn.addEventListener('click', function () {
        token = '';
        currentLogin = '';
        localStorage.removeItem('github_token');
        el.tokenInput.value = '';
        showView('auth');
      });

      /* ── Book list ── */

      function loadBooks() {
        el.booksLoading.style.display = '';
        el.booksGrid.innerHTML = '';
        el.emptyState.style.display = 'none';

        fetchDownloadStats();

        ghFetch('/repos/' + REPO + '/contents/src/content/books')
          .then(function (files) {
            var mdFiles = files.filter(function (f) { return f.name.endsWith('.md'); });
            if (mdFiles.length === 0) {
              el.booksLoading.style.display = 'none';
              el.emptyState.style.display = '';
              booksCache = [];
              return;
            }
            return Promise.all(mdFiles.map(function (f) {
              return ghFetch('/repos/' + REPO + '/contents/src/content/books/' + f.name)
                .then(function (data) {
                  var content = decodeBase64Utf8(data.content);
                  var parsed = parseFrontmatter(content);
                  if (!parsed) return null;
                  var fm = parsed.frontmatter;
                  return {
                    slug: f.name.replace('.md', ''),
                    pubDate: fm.pubDate || '',
                    title: fm.title || '',
                    author: fm.author || '',
                    coverImage: fm.coverImage || '',
                    exampleImages: fm.exampleImages || [],
                    colorEpub: fm.colorEpub || '',
                    bwEpub: fm.bwEpub || '',
                    series: fm.series || '',
                    seriesOrder: fm.seriesOrder || '',
                    body: parsed.body,
                  };
                })
                .catch(function () { return null; });
            }));
          })
          .then(function (loaded) {
            if (!loaded) return;
            booksCache = loaded.filter(Boolean);
            el.booksLoading.style.display = 'none';
            if (booksCache.length === 0) {
              el.emptyState.style.display = '';
              return;
            }
            sortBooksAndRender();
          })
          .catch(function (err) {
            el.booksLoading.style.display = 'none';
            if (err.message && err.message.indexOf('Not Found') !== -1) {
              el.emptyState.style.display = '';
              booksCache = [];
            } else {
              var errDiv = document.createElement('div');
              errDiv.className = 'error-text';
              errDiv.textContent = 'Ошибка загрузки: ' + err.message;
              el.booksGrid.appendChild(errDiv);
            }
          });
      }

      function sortBooksAndRender() {
        var mode = el.sortSelect.value;
        booksCache.sort(function(a, b) {
          if (mode === 'downloads') {
            var aColorName = a.colorEpub ? a.colorEpub.split('/').pop() : '';
            var aBwName = a.bwEpub ? a.bwEpub.split('/').pop() : '';
            var aCount = (statsCache[aColorName] || 0) + (statsCache[aBwName] || 0);

            var bColorName = b.colorEpub ? b.colorEpub.split('/').pop() : '';
            var bBwName = b.bwEpub ? b.bwEpub.split('/').pop() : '';
            var bCount = (statsCache[bColorName] || 0) + (statsCache[bBwName] || 0);

            if (bCount !== aCount) return bCount - aCount;
            // Если скачивания равны, сортируем по дате
            var aDate = a.pubDate ? new Date(a.pubDate).getTime() : 0;
            var bDate = b.pubDate ? new Date(b.pubDate).getTime() : 0;
            return bDate - aDate;
          } else if (mode === 'alpha') {
            return a.title.localeCompare(b.title, 'ru', { sensitivity: 'base' });
          } else { // 'newest'
            var aDate = a.pubDate ? new Date(a.pubDate).getTime() : 0;
            var bDate = b.pubDate ? new Date(b.pubDate).getTime() : 0;
            return bDate - aDate;
          }
        });
        renderBookList();
      }

      el.sortSelect.addEventListener('change', sortBooksAndRender);

      function renderBookList() {
        el.booksGrid.innerHTML = '';
        booksCache.forEach(function (book) {
          var card = document.createElement('div');
          card.className = 'book-card';

          var topDiv = document.createElement('div');
          topDiv.className = 'book-card-top';

          var coverDiv = document.createElement('div');
          coverDiv.className = 'book-card-cover';
          var img = document.createElement('img');
          img.src = getRawUrl(book.coverImage);
          img.alt = book.title;
          img.onerror = function () { this.style.display = 'none'; };
          coverDiv.appendChild(img);

          var infoDiv = document.createElement('div');
          infoDiv.className = 'book-card-info';
          var titleEl = document.createElement('div');

          var bwName = book.bwEpub ? book.bwEpub.split('/').pop() : '';

          var colorCount = colorName && statsCache[colorName] ? statsCache[colorName] : 0;
          var bwCount = bwName && statsCache[bwName] ? statsCache[bwName] : 0;

          var colorDiv = document.createElement('div');
          colorDiv.innerHTML = '<span style="color:var(--accent)">Цвет:</span> ' + colorCount;

          statsEl.appendChild(colorDiv);

          infoDiv.appendChild(titleEl);

          topDiv.appendChild(coverDiv);
          topDiv.appendChild(infoDiv);

          var actionsDiv = document.createElement('div');
          actionsDiv.className = 'book-card-actions';

          var editBtn = document.createElement('button');
          editBtn.className = 'btn-card';

          editBtn.addEventListener('click', function () { startEdit(book); });

          var deleteBtn = document.createElement('button');
          deleteBtn.className = 'btn-card danger';
          deleteBtn.type = 'button';
          deleteBtn.innerHTML = '<svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="margin-top: 2px;"><path d="M3 6h18"></path><path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"></path><path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"></path></svg>';
          deleteBtn.title = 'Удалить';
          deleteBtn.addEventListener('click', function () { showDeleteConfirm(book); });

          actionsDiv.appendChild(editBtn);
          actionsDiv.appendChild(deleteBtn);

          card.appendChild(topDiv);
          card.appendChild(actionsDiv);
          el.booksGrid.appendChild(card);
        });
      }

      /* ── Navigation buttons ── */

      el.addBookBtn.addEventListener('click', function () { startCreate(); });
      el.backBtn.addEventListener('click', function () { showView('list'); });

      /* ── Form: create vs edit ── */

      function resetFormState() {
        el.bookForm.reset();
        coverFile = null;
        coverExisting = null;
        exampleItems = [];
        el.colorEpubUrl.value = '';
        el.bwEpubUrl.value = '';
        el.coverPreview.style.display = 'none';
        el.coverZone.style.display = '';
        el.coverInput.value = '';
        el.examplesPreviews.innerHTML = '';

        el.publishBtn.disabled = true;
        tabEdit.classList.add('active');
        tabPreview.classList.remove('active');
        el.bodyText.style.display = '';
        mdPreview.style.display = 'none';
      }

      function startCreate() {
        editMode = 'create';
        editingSlug = null;
        editingBookData = null;
        resetFormState();
        el.bodyText.value = DEFAULT_BODY;
        el.publishBtn.textContent = 'Опубликовать книгу';
        el.pageTitle.textContent = 'Добавить книгу';
        showView('form');
      }

      function startEdit(book) {
        editMode = 'edit';
        editingSlug = book.slug;
        editingBookData = book;
        resetFormState();

        el.title.value = book.title;
        el.author.value = book.author;
        el.series.value = book.series || '';
        el.seriesOrder.value = book.seriesOrder || '';
        el.bodyText.value = book.body;

        coverExisting = { path: getRepoPath(book.coverImage), ext: ext(book.coverImage) };
        el.coverImg.src = getRawUrl(book.coverImage);
        el.coverPreview.style.display = 'block';
        el.coverZone.style.display = 'none';

        exampleItems = book.exampleImages.map(function (imgPath) {
          return { type: 'existing', url: getRawUrl(imgPath), path: getRepoPath(imgPath), ext: ext(imgPath) };
        });
        renderExamplePreviews();

        el.colorEpubUrl.value = book.colorEpub;
        el.bwEpubUrl.value = book.bwEpub;

        el.publishBtn.textContent = 'Сохранить изменения';
        el.publishBtn.disabled = false;
        el.pageTitle.textContent = 'Редактировать книгу';
        showView('form');
      }

      /* ── Drop zones ── */

      function setupDropZone(zone, input) {
        ['dragenter', 'dragover'].forEach(function (evt) {
          zone.addEventListener(evt, function (e) {
            e.preventDefault();
            zone.classList.add('dragover');
          });
        });
        ['dragleave', 'drop'].forEach(function (evt) {
          zone.addEventListener(evt, function () { zone.classList.remove('dragover'); });
        });
        zone.addEventListener('drop', function (e) {
          e.preventDefault();
          input.files = e.dataTransfer.files;
          input.dispatchEvent(new Event('change'));
        });
      }

      setupDropZone(el.coverZone, el.coverInput);
      setupDropZone(el.examplesZone, el.examplesInput);


      /* ── Cover ── */

      el.coverInput.addEventListener('change', function () {
        var f = el.coverInput.files[0];
        if (!f) return;
        coverFile = f;
        coverExisting = null;
        el.coverImg.src = URL.createObjectURL(f);
        el.coverPreview.style.display = 'block';
        el.coverZone.style.display = 'none';
        validateForm();
      });

      document.getElementById('coverRemoveBtn').addEventListener('click', function () {
        coverFile = null;
        coverExisting = null;
        el.coverImg.src = '';
        el.coverPreview.style.display = 'none';
        el.coverZone.style.display = '';
        el.coverInput.value = '';
        validateForm();
      });

      /* ── Example illustrations ── */

      el.examplesInput.addEventListener('change', function () {
        var incoming = Array.from(el.examplesInput.files);
        for (var i = 0; i < incoming.length; i++) {
          if (exampleItems.length >= 4) break;
          exampleItems.push({ type: 'new', file: incoming[i] });
        }
        renderExamplePreviews();
        validateForm();
      });

      function renderExamplePreviews() {
        el.examplesPreviews.innerHTML = '';
        exampleItems.forEach(function (item, i) {
          var div = document.createElement('div');
          div.className = 'preview-item';
          var img = document.createElement('img');
          img.src = item.type === 'existing' ? item.url : URL.createObjectURL(item.file);
          img.alt = '';
          var btn = document.createElement('button');
          btn.className = 'remove-btn';
          btn.type = 'button';
          btn.textContent = '×';
          btn.addEventListener('click', function () {
            exampleItems.splice(i, 1);
            renderExamplePreviews();
            validateForm();
          });
          div.appendChild(img);
          div.appendChild(btn);
          el.examplesPreviews.appendChild(div);
        });
      }

      el.colorEpubUrl.addEventListener('input', validateForm);
      el.bwEpubUrl.addEventListener('input', validateForm);

      /* ── Validation ── */

      function validateForm() {
        var ok =
          el.title.value.trim() &&

          (coverFile || coverExisting) &&

      el.author.addEventListener('input', validateForm);

      /* ── Progress overlay ── */

      function setProgress(pct, text) {
        el.progressFill.style.width = pct + '%';
        el.progressStatus.textContent = text;
      }

      function showOverlay(title) {
        el.overlayTitle.textContent = title || 'Публикация книги';
        el.progressFill.style.width = '0%';
        el.progressStatus.textContent = '';
        el.overlayActions.style.display = 'none';
        el.overlay.classList.add('active');
      }

      function showOverlayResult(title, message, link) {
        el.overlayTitle.textContent = title;
        el.progressStatus.textContent = message;
        if (link) {
          var br = document.createElement('br');
          var a = document.createElement('a');
          a.href = link;
          a.className = 'result-link';
          a.target = '_blank';
          a.textContent = 'Открыть страницу книги';
          el.progressStatus.appendChild(br);
          el.progressStatus.appendChild(a);
        }
        el.overlayActions.style.display = 'block';
      }

      el.overlayClose.addEventListener('click', function () {
        el.overlay.classList.remove('active');
      });

      /* ── Git helpers ── */

      function getHeadContext() {
        return ghFetch('/repos/' + REPO + '/git/ref/heads/' + BRANCH)
          .then(function (ref) {
            var commitSha = ref.object.sha;
            return ghFetch('/repos/' + REPO + '/git/commits/' + commitSha).then(function (commit) {
              return { commitSha: commitSha, baseTreeSha: commit.tree.sha };
            });
          });
      }

      function getRecursiveTree(treeSha) {
        return ghFetch('/repos/' + REPO + '/git/trees/' + treeSha + '?recursive=1');
      }

      function createCommitAndPush(ctx, treeEntries, message) {
        console.log("createCommitAndPush: ", message, treeEntries);
        // Ensure sha is exactly null, not undefined, for deletions
        treeEntries.forEach(function(e) { if (e.sha === undefined) e.sha = null; });
        return ghFetch('/repos/' + REPO + '/git/trees', {
          method: 'POST',
          body: JSON.stringify({ base_tree: ctx.baseTreeSha, tree: treeEntries }),
        })
          .then(function (tree) {
            return ghFetch('/repos/' + REPO + '/git/commits', {
              method: 'POST',
              body: JSON.stringify({ message: message, tree: tree.sha, parents: [ctx.commitSha] }),
            }).then(function (newCommit) {
              return ghFetch('/repos/' + REPO + '/git/refs/heads/' + BRANCH, {
                method: 'PATCH',
                body: JSON.stringify({ force: true, sha: newCommit.sha }),
              }).then(function() {
                return { commitSha: newCommit.sha, baseTreeSha: tree.sha };
              });
            });
          });
      }

      function buildMarkdown(title, author, slug, coverExt, exItems, series, seriesOrder, bodyText, colorEpubName, bwEpubName, pubDate) {
        var fm = '---\n';
        if (pubDate) {
          fm += 'pubDate: ' + pubDate + '\n';
        } else {
          var date = new Date();
          fm += 'pubDate: ' + date.toISOString().split('T')[0] + '\n';
        }
        fm += 'title: "' + title + '"\n';
        fm += 'author: "' + author + '"\n';
        fm += 'coverImage: "../../assets/books/' + slug + '/cover.' + coverExt + '"\n';
        fm += 'exampleImages:\n';
        exItems.forEach(function (item, i) {
          var e = item.type === 'new' ? ext(item.file.name) : item.ext;
          fm += '  - "../../assets/books/' + slug + '/example-' + (i + 1) + '.' + e + '"\n';
        });
        fm += 'colorEpub: "' + colorEpubName + '"\n';
        fm += 'bwEpub: "' + bwEpubName + '"\n';
        if (series) fm += 'series: "' + series + '"\n';
        if (seriesOrder) fm += 'seriesOrder: ' + seriesOrder + '\n';
        fm += '---\n\n';
        return fm + bodyText;
      }

      function uploadBlob(content, encoding) {
        return ghFetch('/repos/' + REPO + '/git/blobs', {
          method: 'POST',
          body: JSON.stringify({ content: content, encoding: encoding || 'base64' }),
        });
      }

      function processAllFilesAndPush(ctx, fileEntries, mdContent, mdPath, commitMsg) {
        var promises = fileEntries.map(function(entry) {
           return readFileAsBase64(entry.file)
             .then(function(b64) { return uploadBlob(b64); })
             .then(function(blob) { return { path: entry.path, mode: '100644', type: 'blob', sha: blob.sha }; });
        });

        var mdPromise = uploadBlob(btoa(unescape(encodeURIComponent(mdContent))))
           .then(function(blob) { return { path: mdPath, mode: '100644', type: 'blob', sha: blob.sha }; });

        promises.push(mdPromise);

        return Promise.all(promises).then(function(treeEntries) {
           setProgress(70, 'Сохранение структуры проекта...');
           return createCommitAndPush(ctx, treeEntries, commitMsg);
        });
      }

      /* ── Publish (create) ── */

      function publishCreate(title, author, series, seriesOrder, bodyText, slug) {
        var fileEntries = [];
        fileEntries.push({ file: coverFile, path: 'src/assets/books/' + slug + '/cover.' + ext(coverFile.name), label: coverFile.name });
        exampleItems.forEach(function (item, i) {
          fileEntries.push({ file: item.file, path: 'src/assets/books/' + slug + '/example-' + (i + 1) + '.' + ext(item.file.name), label: item.file.name });
        });

        setProgress(0, 'Подготовка файлов к загрузке...');
        var coverExt = ext(coverFile.name);
        var mdPath = 'src/content/books/' + slug + '.md';
        var md = buildMarkdown(title, author, slug, coverExt, exampleItems, series, seriesOrder, bodyText, el.colorEpubUrl.value.trim(), el.bwEpubUrl.value.trim(), null);

        getHeadContext().then(function(ctx) {
           setProgress(30, 'Загрузка изображений...');
           return processAllFilesAndPush(ctx, fileEntries, md, mdPath, 'Add book: ' + title);
        })
          .then(function () {
            setProgress(100, '');
            showOverlayResult('Книга опубликована!', 'Все пакеты успешно загружены.', 'https://sm1-tee.github.io/chit-ai/books/' + slug + '/');
            showView('list');
            setTimeout(function() {
              try { loadBooks(); } catch(e) { console.error("loadBooks error:", e); }
            }, 0);
          })
          .catch(function (err) {
            console.error("Publish error:", err);
            setProgress(0, '');
            showOverlayResult('Ошибка публикации', err && err.message ? err.message : String(err), null);
          });
      }

      /* ── Publish (edit) ── */

      function publishEdit(title, author, series, seriesOrder, bodyText, newSlug) {
        var oldSlug = editingSlug;
        var treeEntries = [];
        var uploadTasks = [];

        setProgress(0, 'Получение текущего состояния…');

        getHeadContext()
          .then(function (ctx) {
            setProgress(5, 'Анализ файлов…');
            return getRecursiveTree(ctx.baseTreeSha).then(function(tree) {
              var existingFiles = {};
              var oldPublicPrefix = 'public/books/' + oldSlug + '/';
              var oldAssetsPrefix = 'src/assets/books/' + oldSlug + '/';
              var oldMd = 'src/content/books/' + oldSlug + '.md';
              tree.tree.forEach(function (entry) {
                if (entry.type === 'blob' && (entry.path.indexOf(oldPublicPrefix) === 0 || entry.path.indexOf(oldAssetsPrefix) === 0 || entry.path === oldMd)) {
                  existingFiles[entry.path] = entry.sha;
                }
              });

              Object.keys(existingFiles).forEach(function (path) {
                // By default mark all old files for deletion
                treeEntries.push({ path: path, mode: '100644', type: 'blob', sha: null });
              });

              var coverExt;
              if (coverFile) {
                coverExt = ext(coverFile.name);
                uploadTasks.push({ file: coverFile, path: 'src/assets/books/' + newSlug + '/cover.' + coverExt, label: coverFile.name });
              } else if (coverExisting) {
                coverExt = coverExisting.ext;
                treeEntries.push({ path: 'src/assets/books/' + newSlug + '/cover.' + coverExt, mode: '100644', type: 'blob', sha: existingFiles[coverExisting.path] });
              }

              exampleItems.forEach(function (item, i) {
                if (item.type === 'new') {
                  uploadTasks.push({ file: item.file, path: 'src/assets/books/' + newSlug + '/example-' + (i + 1) + '.' + ext(item.file.name), label: item.file.name });
                } else {
                  treeEntries.push({ path: 'src/assets/books/' + newSlug + '/example-' + (i + 1) + '.' + item.ext, mode: '100644', type: 'blob', sha: existingFiles[item.path] });
                }
              });



              // Filter out treeEntries mapping (deduplicate)
              var deduped = {};
              treeEntries.forEach(function (e) { deduped[e.path] = e; });
              treeEntries = Object.keys(deduped).map(function (k) { return deduped[k]; });

              console.log("Existing files to remove in update:", treeEntries);

              var mdPath = 'src/content/books/' + newSlug + '.md';
              var coverExtToPass = coverFile ? ext(coverFile.name) : coverExisting ? coverExisting.ext : 'jpg';
              var pubDateToPass = editingBookData && editingBookData.pubDate ? editingBookData.pubDate : null;
              var md = buildMarkdown(title, author, newSlug, coverExtToPass, exampleItems, series, seriesOrder, bodyText, el.colorEpubUrl.value.trim(), el.bwEpubUrl.value.trim(), pubDateToPass);

              var allPromises = uploadTasks.map(function(entry) {
                 return readFileAsBase64(entry.file)
                   .then(function(b64) { return uploadBlob(b64); })
                   .then(function(blob) { return { path: entry.path, mode: '100644', type: 'blob', sha: blob.sha }; });
              });

              var mdPromise = uploadBlob(btoa(unescape(encodeURIComponent(md))))
                 .then(function(blob) { return { path: mdPath, mode: '100644', type: 'blob', sha: blob.sha }; });

              allPromises.push(mdPromise);

              setProgress(30, 'Загрузка новых файлов...');
              return Promise.all(allPromises).then(function(newTreeEntries) {
                 var finalTreeEntries = treeEntries.concat(newTreeEntries);
                 
                 // Remove entries that have sha: null but are being overwritten by new files
                 // in GitHub API if you include sha: null and sha: <new_sha> for the same file, it might fail.
                 var uniqueEntries = {};
                 finalTreeEntries.forEach(function(e) {
                   if (e.sha !== null || typeof uniqueEntries[e.path] === 'undefined') {
                     uniqueEntries[e.path] = e;
                   }
                 });
                 finalTreeEntries = Object.keys(uniqueEntries).map(function(k) { return uniqueEntries[k]; });
                 
                 setProgress(70, 'Сохранение обновленной структуры...');
                 return createCommitAndPush(ctx, finalTreeEntries, 'Update book: ' + title);
              });
            });
          })
          .then(function () {
            setProgress(100, '');
            showOverlayResult('Изменения сохранены!', 'Все пакеты успешно обновлены.', 'https://sm1-tee.github.io/chit-ai/books/' + newSlug + '/');
            showView('list');
            setTimeout(function() {
              try { loadBooks(); } catch(e) { console.error("loadBooks error:", e); }
            }, 0);
          })
          .catch(function (err) {
            console.error("Publish error:", err);
            setProgress(0, '');
            showOverlayResult('Ошибка сохранения', err && err.message ? err.message : String(err), null);
          });
      }


      /* ── Publish dispatcher ── */

      el.publishBtn.addEventListener('click', function () {
        var title = el.title.value.trim();
        var author = el.author.value.trim();

      /* ── Delete ── */

      function showDeleteConfirm(book) {
        deletingBook = book;

        el.deleteOverlay.classList.add('active');
      }

      el.cancelDeleteBtn.addEventListener('click', function () {

      });

      el.confirmDeleteBtn.addEventListener('click', function () {
        if (!deletingBook) return;
        var book = deletingBook;
        deletingBook = null;
        el.deleteOverlay.classList.remove('active');

        showOverlay('Удаление книги');
        setProgress(0, 'Получение структуры репозитория…');

        var ctx;
        getHeadContext()
          .then(function (c) {
            ctx = c;
            setProgress(15, 'Получение дерева файлов…');
            return getRecursiveTree(ctx.baseTreeSha);
          })
          .then(function (tree) {
            setProgress(35, 'Удаление файлов…');
            var publicPrefix = 'public/books/' + book.slug + '/';
            var assetsPrefix = 'src/assets/books/' + book.slug + '/';
            var mdPath = 'src/content/books/' + book.slug + '.md';
            var deleteEntries = [];

            tree.tree.forEach(function (entry) {
              if (entry.type === 'blob' && (entry.path.indexOf(publicPrefix) === 0 || entry.path.indexOf(assetsPrefix) === 0 || entry.path === mdPath)) {
                // To delete a file via GitHub Trees API, you set sha to null
                deleteEntries.push({ path: entry.path, mode: '100644', type: 'blob', sha: null });
              }
            });

            console.log("Found files to delete:", deleteEntries);
            if (deleteEntries.length === 0) throw new Error('Файлы книги не найдены');

            setProgress(55, 'Создание коммита…');
            return createCommitAndPush(ctx, deleteEntries, 'Delete book: ' + book.title);
          })
          .then(function () {
            setProgress(100, '');
            showOverlayResult('Книга удалена', 'Деплой запустится автоматически.', null);
            setTimeout(function() {
              try { loadBooks(); } catch(e) { console.error("loadBooks error:", e); }
            }, 0);
          })
          .catch(function (err) {
            console.error("Delete error:", err);
            setProgress(0, '');
            showOverlayResult('Ошибка удаления', err && err.message ? err.message : String(err), null);
          });
      });

      /* ── Markdown preview ── */

      var tabEdit = document.getElementById('tabEdit');
      var tabPreview = document.getElementById('tabPreview');
      var mdPreview = document.getElementById('mdPreview');

      function renderMarkdown(src) {
        var html = src
          .replace(/&/g, '&amp;')
          .replace(/</g, '&lt;')
          .replace(/>/g, '&gt;');

        html = html.replace(/^### (.+)$/gm, '<h3>$1</h3>');
        html = html.replace(/^## (.+)$/gm, '<h2>$1</h2>');
        html = html.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');

        var lines = html.split('\n');
        var result = [];
        var inList = false;

        for (var i = 0; i < lines.length; i++) {
          var line = lines[i];
          var listMatch = line.match(/^- (.+)/);
          if (listMatch) {
            if (!inList) { result.push('<ul>'); inList = true; }
            result.push('<li>' + listMatch[1] + '</li>');
          } else {
            if (inList) { result.push('</ul>'); inList = false; }
            if (line.match(/^<h[23]>/)) {
              result.push(line);
            } else if (line.trim() === '') {
              result.push('');
            } else {
              result.push('<p>' + line + '</p>');
            }
          }
        }
        if (inList) result.push('</ul>');

        return result.join('\n').replace(/(<\/p>\n<p>)/g, ' ').replace(/\n{2,}/g, '\n');
      }

      tabEdit.addEventListener('click', function () {
        tabEdit.classList.add('active');
        tabPreview.classList.remove('active');
        el.bodyText.style.display = '';
        mdPreview.style.display = 'none';

      tabPreview.addEventListener('click', function () {
        tabPreview.classList.add('active');
        tabEdit.classList.remove('active');

        mdPreview.style.display = 'block';
        mdPreview.innerHTML = renderMarkdown(el.bodyText.value);
      });

      (function () {

          doLogin();
        }

      /* ── Лента скачиваний ── */

      var DL_LOG_URL = RAW_BASE + '/data/downloads-log.json';
      var dlLoaded = false;

      function dlEsc(text) {
        return String(text == null ? '' : text)
          .replace(/&/g, '&amp;')
          .replace(/</g, '&lt;')
          .replace(/>/g, '&gt;')
          .replace(/"/g, '&quot;');
      }

      function dlPrettyName(name) {
        var out = String(name || '').replace(/[_]+/g, ' ').trim();
        if (!out) return 'Без названия';
        return out.charAt(0).toUpperCase() + out.slice(1);
      }

      function dlVariant(v) {
        if (v === 'color') return 'цветной';
        if (v === 'bw') return 'чёрно-белый';
        return 'файл';
      }

      function dlWhen(iso) {
        if (!iso) return '';
        var d = new Date(iso);
        if (isNaN(d.getTime())) return '';
        return d.toLocaleString('ru-RU', {
          day: 'numeric',
          month: 'long',
          hour: '2-digit',
          minute: '2-digit'
        });
      }

      function dlRender(data) {
        var body = document.getElementById('dlBody');
        var updated = document.getElementById('dlUpdated');
        if (!body) return;

        var events = (data && data.events) || [];
        var totals = (data && data.totalsByRelease) || [];
        var total = (data && typeof data.total === 'number') ? data.total : 0;

        if (updated) {
          updated.textContent = data && data.updatedAt
            ? 'проверено ' + dlWhen(data.updatedAt)
            : '';
        }

        var html = '<div class="dl-total">Всего скачиваний за всё время: <strong>' + total.toLocaleString('ru-RU') + '</strong></div>';

        html += '<div class="dl-section-title">История скачиваний</div>';
        if (!events.length) {
          html += '<div class="dl-empty">Новых скачиваний пока не было.<br>Как только книгу скачают, запись появится здесь и останется навсегда.</div>';
        } else {
          for (var i = 0; i < events.length; i++) {
            var ev = events[i];
            html += '<div class="dl-item">' +
              '<div class="dl-when">' + dlEsc(dlWhen(ev.at)) + '</div>' +
              '<div class="dl-item-title">' + dlEsc(dlPrettyName(ev.release || ev.tag)) + '</div>' +
              '<div class="dl-meta">' + dlEsc(dlVariant(ev.variant)) +
              ' · <span class="dl-delta">+' + dlEsc(ev.delta) + '</span>' +
              ' · всего ' + dlEsc(ev.total) + '</div>' +
              '</div>';
          }
        }

        if (totals.length) {
          html += '<div class="dl-section-title">Все скачивания по книгам</div>';
          for (var j = 0; j < totals.length; j++) {
            var t = totals[j];
            html += '<div class="dl-row">' +
              '<span>' + dlEsc(dlPrettyName(t.release || t.tag)) + '</span>' +
              '<span class="dl-row-count">' + dlEsc(t.total) + '</span>' +
              '</div>';
          }
        }

        html += '<div class="dl-note">История ведётся с момента включения сбора статистики и не обнуляется. Счётчики проверяются каждые 30 минут, поэтому время в записях точно до получаса.</div>';

        body.innerHTML = html;
      }

      function loadDownloadFeed() {
        var body = document.getElementById('dlBody');
        if (body && !dlLoaded) body.innerHTML = '<div class="dl-empty">Загрузка…</div>';
        return fetch(DL_LOG_URL + '?t=' + Date.now(), { cache: 'no-store' })
          .then(function (res) {
            if (res.status === 404) return { events: [], total: 0, pending: true };
            if (!res.ok) throw new Error('HTTP ' + res.status);
            return res.json();
          })
          .then(function (data) {
            dlLoaded = true;
            if (data && data.pending) {
              var b = document.getElementById('dlBody');
              if (b) b.innerHTML = '<div class="dl-empty">Сбор статистики только что включён. Первые данные появятся в течение получаса.</div>';
              return;
            }
            dlRender(data);
          })
          .catch(function (e) {
            console.error('Ошибка загрузки ленты скачиваний:', e);
            var b = document.getElementById('dlBody');
            if (b) b.innerHTML = '<div class="dl-empty">Не удалось загрузить данные. Попробуйте кнопку обновления.</div>';
          });
      }

      function dlSetDrawer() {
        /* панель закреплена и всегда видна */
      }

      (function initDownloadFeed() {
        var refreshBtn = document.getElementById('dlRefresh');
        if (refreshBtn) refreshBtn.addEventListener('click', function () { loadDownloadFeed(); });
        setInterval(loadDownloadFeed, 300000);
        document.addEventListener('visibilitychange', function () {
          if (!document.hidden) loadDownloadFeed();
        });
        loadDownloadFeed();
      })();
