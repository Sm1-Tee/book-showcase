name: Deploy Astro site to GitHub Pages

on:
  # Запускать деплой при каждом пуше в текущую основную ветку
  push:
    branches: [master]
    paths-ignore:
      - 'docs/**'
      - 'data/**'
  # Позволяет запускать этот workflow вручную из вкладки Actions
  workflow_dispatch:

# Устанавливаем права для токена GITHUB_TOKEN
permissions:
  contents: write

# Разрешаем только один одновременный деплой
concurrency:
  group: "pages"
  cancel-in-progress: false

env:
  BUILD_PATH: "." # Если проект в корне репозитория

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci || npm install

      - name: Build with Astro
        run: npm run build

      - name: Publish built site into docs/ (branch-based Pages)
        run: |
          rm -rf docs
          cp -r dist docs
          touch docs/.nojekyll
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A docs
          if git diff --quiet --cached; then
            echo 'docs already up to date'
          else
            git commit -m 'chore: publish built site to docs'
            pushed=0
            for attempt in 1 2 3 4 5; do
              if git pull --rebase --autostash origin master && git push origin HEAD:master; then
                pushed=1
                break
              fi
              echo "Push attempt $attempt failed, retrying..."
              sleep 7
            done
            if [ "$pushed" != "1" ]; then
              echo 'Could not publish docs after 5 attempts'
              exit 1
            fi
          fi
