name: Track download counts

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: track-downloads
  cancel-in-progress: false

jobs:
  track:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Collect download counts
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/track-downloads.mjs

      - name: Commit updated stats
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then
            echo "No changes in download stats"
          else
            git commit -m "chore: update download stats"
            pushed=0
            for attempt in 1 2 3 4 5; do
              if git pull --rebase --autostash origin master && git push origin HEAD:master; then
                pushed=1
                break
              fi
              echo "Push attempt $attempt failed, retrying..."
              sleep 7
            done
            if [ "$pushed" != "1" ]; then
              echo 'Could not publish download stats after 5 attempts'
              exit 1
            fi
          fi
